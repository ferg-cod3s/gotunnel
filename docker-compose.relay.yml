services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    ports:
      - "8080:8080"
    environment:
      - RELAY_DOMAIN=${RELAY_DOMAIN:-tunnel.example.com}
      - RELAY_ADDR=:8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
